[package]
name = "molecular_visualization"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "molecular_visualization"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:clap", "dep:glium", "dep:once_cell"]
web = ["dep:wasm-bindgen", "dep:js-sys", "dep:web-sys"]

[dependencies]
clap = { version = "4.5.26", features = ["derive"], optional = true }
glium = { version = "0.36.0", optional = true }
nalgebra = "0.33.2"
pdbtbx = { version = "0.12.0", default-features = false, features = ["compression"] }
anyhow = "1.0.93"
once_cell = { version = "1.20.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlProgram",
    "WebGlShader",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
] }
